[workspace]
members = [
    "crates/fido-key-wrap",
    "crates/fido-key-wrap-libfido2",
    "crates/fido-key-wrap-platform",
    "crates/fkw-tool",
]
resolver = "3"

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.85"

[workspace.dependencies]
aes-gcm = { version = "0.10.3", default-features = false, features = ["aes", "zeroize"] }
aes = { version = "0.8.4", features = ["zeroize"] }
anyhow = "1.0.103"
base64 = "0.22.1"
argon2 = { version = "0.5.3", default-features = false, features = ["zeroize"] }
clap = { version = "4.6.1", features = ["derive"] }
chacha20poly1305 = "0.10.1"
tempfile = "3.27.0"
getrandom = "0.4.3"
ghash = { version = "0.5.1", features = ["zeroize"] }
hkdf = "0.13.0"
hmac = { version = "0.13.0", features = ["zeroize"] }
libc = "0.2.183"
libloading = "0.8.9"
minicbor = { version = "2.2.2", features = ["std"] }
p256 = { version = "0.14.0", default-features = false, features = ["arithmetic", "std"] }
rpassword = "7.5.4"
sha2 = { version = "0.11.0", features = ["zeroize"] }
subtle = "2.6.1"
thiserror = "2.0.18"
zeroize = { version = "1.9.0", features = ["derive"] }

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = "deny"
pedantic = "deny"
